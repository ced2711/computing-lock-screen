name: Linux

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    # oldest supported runner: the binaries need a glibc at least this old to run on most distros
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install X server and tools
        run: sudo apt-get update && sudo apt-get install -y xvfb x11-xserver-utils imagemagick

      - name: Smoke test (lock, input, wrong + right password)
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python tests/smoke_test.py import -window root screenshot-linux.png

      - name: Build binaries
        run: |
          pip install pyinstaller "opencv-python-headless>=4.8,<5"
          sh build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ComputingLock-linux
          path: |
            dist/ComputingLock
            dist/ComputingLock-Camera
            screenshot-linux.png
